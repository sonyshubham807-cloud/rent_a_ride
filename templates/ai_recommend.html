<!DOCTYPE html>
<html>

<head>

    <title>AI Vehicle Recommendation</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>

        body{
            background:
            linear-gradient(to right,#0f172a,#1e3a8a);

            color: white;
        }

        .recommend-box{

            max-width: 700px;

            margin: auto;

            margin-top: 80px;

            background: rgba(255,255,255,0.1);

            padding: 40px;

            border-radius: 20px;

            backdrop-filter: blur(15px);
        }

        .form-control,
        .form-select{

            height: 50px;

            border-radius: 10px;
        }

        .btn-ai{

            background: #2563eb;

            color: white;

            height: 50px;

            border-radius: 10px;

            width: 100%;
        }

        .result{

            background: white;

            color: black;

            padding: 20px;

            border-radius: 15px;

            margin-top: 30px;
        }

    </style>

</head>

<body>

<div class="recommend-box">

    <h1 class="text-center mb-4">

        🤖 Smart Vehicle Recommendation

    </h1>

    <form method="POST">

        <div class="mb-3">

            <input type="number"
                   name="budget"
                   class="form-control"
                   placeholder="Enter Budget"
                   required>

        </div>

        <div class="mb-3">

            <input type="number"
                   name="passengers"
                   class="form-control"
                   placeholder="Number of Passengers"
                   required>

        </div>

        <div class="mb-4">

            <select name="trip_type"
                    class="form-select">

                <option>Family Trip</option>

                <option>Adventure</option>

                <option>City Ride</option>

                <option>Long Drive</option>

            </select>

        </div>

        <button class="btn btn-ai">

            Get Recommendation

        </button>

    </form>

    {% if recommendation %}

    <div class="result">

        <h4>AI Recommendation</h4>

        <p>{{ recommendation }}</p>

    </div>

    {% endif %}

</div>

</body>
</html>
