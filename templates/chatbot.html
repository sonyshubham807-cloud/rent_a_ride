<!DOCTYPE html>
<html>

<head>

    <title>AI Chatbot</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>

        body{
            background:
            linear-gradient(to right,#111827,#1e3a8a);

            color: white;
        }

        .chat-box{

            max-width: 700px;

            margin: auto;

            margin-top: 80px;

            background: rgba(255,255,255,0.1);

            padding: 40px;

            border-radius: 20px;

            backdrop-filter: blur(15px);
        }

        .form-control{

            height: 50px;

            border-radius: 10px;
        }

        .btn-chat{

            background: #2563eb;

            color: white;

            height: 50px;

            border-radius: 10px;
        }

        .response{

            background: white;

            color: black;

            padding: 20px;

            border-radius: 15px;

            margin-top: 30px;
        }

    </style>

</head>

<body>

<div class="chat-box">

    <h1 class="text-center mb-4">

        🤖 AI Rental Assistant

    </h1>

    <form method="POST">

        <div class="mb-4">

            <input type="text"
                   name="message"
                   class="form-control"
                   placeholder="Ask anything..."
                   required>

        </div>

        <button class="btn btn-chat w-100">

            Send

        </button>

    </form>

    {% if response %}

    <div class="response">

        <h4>AI Response</h4>

        <p>{{ response }}</p>

    </div>

    {% endif %}

</div>

</body>
</html>
