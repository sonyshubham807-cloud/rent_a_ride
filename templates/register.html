<!DOCTYPE html>
<html>

<head>
    <title>Register</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

<div class="container mt-5">
    <div class="form-container col-md-6 offset-md-3">
        <h2 class="text-center mb-4">Create Account</h2>
        
        <!-- Added needs-validation class and novalidate attribute -->
        <form method="POST" class="needs-validation" novalidate>
            
            <div class="mb-3">
                <input type="text"
                       name="full_name"
                       class="form-control"
                       placeholder="Full Name"
                       required>
                <div class="invalid-feedback">
                    Please enter your full name.
                </div>
            </div>

            <div class="mb-3">
                <input type="email"
                       name="email"
                       class="form-control"
                       placeholder="Email"
                       required>
                <div class="invalid-feedback">
                    Please enter a valid email address.
                </div>
            </div>

            <div class="mb-3">
                <input type="password"
                       name="password"
                       class="form-control"
                       placeholder="Password"
                       minlength="6"
                       required>
                <div class="invalid-feedback">
                    Please provide a password (minimum 6 characters).
                </div>
            </div>

            <!-- Changed to type="tel" and added a pattern for digits -->
            <div class="mb-3">
                <input type="tel"
                       name="phone"
                       class="form-control"
                       placeholder="Phone "
                       pattern="[0-9]{10,15}">
                <div class="invalid-feedback">
                    If provided, please enter a valid phone number (10-15 digits).
                </div>
            </div>

            <!-- Left as optional since it didn't have a required attribute -->
            <div class="mb-3">
                <textarea name="address"
                          class="form-control"
                          placeholder="Address "></textarea>
            </div>

            <button type="submit" class="btn btn-primary w-100 mb-3">
                Register
            </button>

            <a href="{{ url_for('login') }}" class="btn btn-outline-secondary w-100">
                Already have an account? Login
            </a>

        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- Script to handle Bootstrap validation logic -->
<script>
    (() => {
        'use strict'

        // Fetch all the forms we want to apply custom Bootstrap validation styles to
        const forms = document.querySelectorAll('.needs-validation')

        // Loop over them and prevent submission if invalid
        Array.from(forms).forEach(form => {
            form.addEventListener('submit', event => {
                if (!form.checkValidity()) {
                    event.preventDefault()
                    event.stopPropagation()
                }

                // Adds the 'was-validated' class which triggers the red/green borders and messages
                form.classList.add('was-validated')
            }, false)
        })
    })()
</script>

</body>
</html>
