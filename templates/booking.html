<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Vehicle</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(to right, #0f172a, #1e3a8a);
            min-height: 100vh;
            display: flex;
            align-items: center;
            padding: 20px 0;
        }

        /* MAIN CONTAINER */
        .booking-container {
            background: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25);
            min-height: 500px;
        }

        .row.g-0 {
            display: flex;
            align-items: stretch; /* Makes columns match height */
        }

        /* IMAGE SECTION */
        .image-container {
            width: 100%;
            height: 100%;
            min-height: 300px;
            overflow: hidden;
        }

        .vehicle-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            display: block;
        }

        /* RIGHT CONTENT */
        .booking-details {
            padding: 40px;
        }

        .vehicle-title {
            font-size: 40px;
            font-weight: bold;
            color: #111827;
        }

        .price {
            color: #15803d;
            font-size: 32px;
            font-weight: bold;
        }

        .form-control {
            height: 52px;
            border-radius: 12px;
        }

        .btn-book {
            background: #2563eb;
            color: white;
            border-radius: 12px;
            height: 52px;
            font-size: 18px;
            font-weight: bold;
            border: none;
        }

        .btn-book:hover {
            background: #1d4ed8;
            color: white;
        }

        .feature-box {
            background: #f3f4f6;
            padding: 18px;
            border-radius: 12px;
            text-align: center;
        }

        .feature-box h6 {
            font-weight: bold;
            font-size: 0.9rem;
        }

        .feature-box p {
            margin-bottom: 0;
        }

        /* MOBILE RESPONSIVE */
        @media(max-width:768px) {
            body {
                align-items: start;
            }

            .image-container {
                height: 300px;
            }

            .booking-details {
                padding: 25px;
            }

            .vehicle-title {
                font-size: 30px;
            }

            .price {
                font-size: 26px;
            }
        }
    </style>
</head>

<body>

<div class="container">
    <div class="booking-container">
        <div class="row g-0">
            <div class="col-md-6">
                <div class="image-container">
                    {% if vehicle.image %}
                    <img src="{{ url_for('static', filename=vehicle.image) }}" class="vehicle-image" alt="Vehicle">
                    {% else %}
                    <img src="https://via.placeholder.com/600x500" class="vehicle-image" alt="Vehicle">
                    {% endif %}
                </div>
            </div>

            <div class="col-md-6">
                <div class="booking-details">
                    <a href="/vehicles" class="btn btn-dark mb-4">← Back</a>
                    
                    <h1 class="vehicle-title">{{ vehicle.vehicle_name }}</h1>
                    <p class="text-muted">{{ vehicle.brand }} • {{ vehicle.vehicle_type }}</p>
                    <h3 class="price">₹{{ vehicle.price_per_day }} / day</h3>
                    <hr>

                    <div class="row mb-4 g-2">
                        <div class="col-4">
                            <div class="feature-box">
                                <h6>Fuel</h6>
                                <p>{{ vehicle.fuel_type }}</p>
                            </div>
                        </div>
                        <div class="col-4">
                            <div class="feature-box">
                                <h6>Seats</h6>
                                <p>{{ vehicle.seating_capacity }}</p>
                            </div>
                        </div>
                        <div class="col-4">
                            <div class="feature-box">
                                <h6>Transmission</h6>
                                <p>{{ vehicle.transmission }}</p>
                            </div>
                        </div>
                    </div>

                    <form method="POST">
                        <div class="mb-3">
                            <label class="form-label">Pickup Date</label>
                            <input type="date" name="pickup_date" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Return Date</label>
                            <input type="date" name="return_date" class="form-control" required>
                        </div>
                        <div class="mb-4">
                            <label class="form-label">Total Days</label>
                            <input type="number" name="total_days" class="form-control" placeholder="Enter Total Days" required>
                        </div>
                        <button type="submit" class="btn btn-book w-100">Confirm Booking</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
