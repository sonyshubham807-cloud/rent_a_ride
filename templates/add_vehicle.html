<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Vehicle</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f1f5f9; padding: 20px 0; }
        .form-container { max-width: 600px; margin: auto; background: white; padding: 30px; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.08); }
    </style>
</head>
<body>

<div class="container">
    <div class="form-container">
        <h2 class="mb-4 text-center">Add Vehicle</h2>
        <form method="POST">
            <div class="mb-3">
                <input type="text" name="vehicle_name" class="form-control" placeholder="Vehicle Name" required>
            </div>
            <div class="mb-3">
                <input type="text" name="vehicle_type" class="form-control" placeholder="Vehicle Type" required>
            </div>
            <div class="row g-3 mb-3">
                <div class="col-md-6">
                    <input type="text" name="brand" class="form-control" placeholder="Brand" required>
                </div>
                <div class="col-md-6">
                    <input type="text" name="model" class="form-control" placeholder="Model" required>
                </div>
            </div>
            <div class="row g-3 mb-3">
                <div class="col-md-6">
                    <input type="text" name="fuel_type" class="form-control" placeholder="Fuel Type" required>
                </div>
                <div class="col-md-6">
                    <input type="text" name="transmission" class="form-control" placeholder="Transmission" required>
                </div>
            </div>
            <div class="row g-3 mb-4">
                <div class="col-md-4">
                    <input type="number" name="seating_capacity" class="form-control" placeholder="Seats" required>
                </div>
                <div class="col-md-4">
                    <input type="number" name="price_per_day" class="form-control" placeholder="Price/Day" required>
                </div>
                <div class="col-md-4">
                    <input type="text" name="vehicle_number" class="form-control" placeholder="Vehicle Number" required>
                </div>
            </div>
            <button type="submit" class="btn btn-primary w-100 py-2">Add Vehicle</button>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
