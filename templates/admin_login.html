<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Admin Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>

        body{

            margin: 0;
            padding: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background:
            linear-gradient(to right,#0f172a,#1e3a8a);

            font-family: Arial, sans-serif;
        }

        .login-card{

            width: 100%;
            max-width: 420px;

            padding: 40px;

            border-radius: 25px;

            background: rgba(255,255,255,0.1);

            backdrop-filter: blur(15px);

            box-shadow:
            0px 10px 30px rgba(0,0,0,0.3);

            color: white;
        }

        .login-card h1{

            text-align: center;
            margin-bottom: 30px;

            font-weight: bold;
        }

        .form-control{

            height: 50px;

            border-radius: 12px;

            border: none;

            padding-left: 15px;
        }

        .form-control:focus{

            box-shadow:
            0px 0px 10px rgba(255,255,255,0.5);
        }

        .btn-login{

            width: 100%;

            height: 50px;

            border-radius: 12px;

            background: #2563eb;

            color: white;

            font-size: 18px;

            font-weight: bold;

            border: none;

            transition: 0.3s;
        }

        .btn-login:hover{

            background: #1d4ed8;

            transform: translateY(-3px);
        }

        .admin-icon{

            font-size: 70px;

            text-align: center;

            margin-bottom: 15px;
        }

        .back-btn{

            color: white;

            text-decoration: none;

            display: inline-block;

            margin-bottom: 20px;
        }

        .back-btn:hover{

            color: #93c5fd;
        }

    </style>

</head>

<body>

<div class="login-card">

    <!-- Back Button -->

    <a href="/" class="back-btn">
        ← Back To Home
    </a>

    <!-- Icon -->

    <div class="admin-icon">

        🔐

    </div>

    <!-- Heading -->

    <h1>Admin Login</h1>

    <!-- Form -->

    <form method="POST">

        <!-- Username -->

        <div class="mb-3">

            <input type="text"
                   name="username"
                   class="form-control"
                   placeholder="Enter Admin Username"
                   required>

        </div>

        <!-- Password -->

        <div class="mb-4">

            <input type="password"
                   name="password"
                   class="form-control"
                   placeholder="Enter Password"
                   required>

        </div>

        <!-- Button -->

        <button type="submit"
                class="btn-login">

            Login

        </button>

    </form>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
