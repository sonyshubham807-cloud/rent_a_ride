<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(to right, #0f172a, #1e3a8a);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .payment-card {
            width: 100%;
            max-width: 500px;
            background: white;
            padding: 40px;
            border-radius: 25px;
            box-shadow: 0px 10px 30px rgba(0, 0, 0, 0.3);
            position: relative; /* Added for optional absolute positioning if needed */
        }

        .payment-title {
            text-align: center;
            margin-bottom: 30px;
            font-weight: bold;
        }

        .price {
            font-size: 35px;
            font-weight: bold;
            color: green;
            text-align: center;
            margin-bottom: 30px;
        }

        .form-select {
            height: 50px;
            border-radius: 12px;
        }

        .btn-pay {
            width: 100%;
            height: 50px;
            border-radius: 12px;
            background: #2563eb;
            color: white;
            font-size: 18px;
            font-weight: bold;
            border: none;
            transition: 0.3s;
        }

        .btn-pay:hover {
            background: #1d4ed8;
        }

        /* --- NEW STYLES FOR BACK BUTTON --- */
        .btn-back {
            display: block;
            width: 100%;
            height: 50px;
            border-radius: 12px;
            background: #f1f5f9;
            color: #475569;
            font-size: 18px;
            font-weight: bold;
            border: 1px solid #cbd5e1;
            margin-top: 15px;
            text-align: center;
            line-height: 48px; /* Centers text vertically */
            text-decoration: none;
            transition: 0.3s;
        }

        .btn-back:hover {
            background: #e2e8f0;
            color: #0f172a;
        }
    </style>
</head>

<body>

    <div class="payment-card">
        <h2 class="payment-title">
            💳 Payment Gateway
        </h2>

        <h4 class="text-center mb-3">
            {{ booking.vehicle_name }}
        </h4>

        <div class="price">
            ₹{{ booking.total_amount }}
        </div>

        <form method="POST">
            <div class="mb-4">
                <label class="form-label">
                    Select Payment Method
                </label>
                <select name="payment_method" class="form-select">
                    <option>UPI</option>
                    <option>Credit Card</option>
                    <option>Debit Card</option>
                    <option>Net Banking</option>
                    <option>Cash</option>
                </select>
            </div>

            <button type="submit" class="btn-pay">
                Pay Now
            </button>

            <!-- NEW BACK BUTTON -->
            <a href="javascript:history.back()" class="btn-back">
                Go Back
            </a>
            
        </form>
    </div>

</body>
</html>
