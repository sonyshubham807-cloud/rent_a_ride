<!DOCTYPE html>
<html>

<head>
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

<div class="container mt-5">
    <div class="form-container col-md-4 offset-md-4">
        <h2 class="text-center mb-4">User Login</h2>
        
        <!-- Added needs-validation class and novalidate attribute -->
        <form method="POST" class="needs-validation" novalidate>
            
            <!-- Wrapped input and feedback in a div -->
            <div class="mb-3">
                <input type="email"
                       name="email"
                       class="form-control"
                       placeholder="Email"
                       required>
                <!-- Error message that appears on invalid submission -->
                <div class="invalid-feedback">
                    Please enter a valid email address.
                </div>
            </div>

            <div class="mb-3">
                <input type="password"
                       name="password"
                       class="form-control"
                       placeholder="Password"
                       minlength="6"
                       required>
                <div class="invalid-feedback">
                    Please enter your password (minimum 6 characters).
                </div>
            </div>

            <button type="submit" class="btn btn-primary w-100 mb-3">
                Login
            </button>

            <a href="{{ url_for('register') }}" class="btn btn-outline-secondary w-100">
                Register
            </a>
            
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- Script to handle Bootstrap validation logic -->
<script>
    (() => {
        'use strict'

        // Fetch all the forms we want to apply custom Bootstrap validation styles to
        const forms = document.querySelectorAll('.needs-validation')

        // Loop over them and prevent submission if invalid
        Array.from(forms).forEach(form => {
            form.addEventListener('submit', event => {
                if (!form.checkValidity()) {
                    event.preventDefault()
                    event.stopPropagation()
                }

                // Adds the 'was-validated' class which triggers the red/green borders and messages
                form.classList.add('was-validated')
            }, false)
        })
    })()
</script>

</body>
</html>
